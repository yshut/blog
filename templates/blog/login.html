{% extends 'base.html' %}

{% block title %}登录 - NewsFlow{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card slide-up">
        <!-- Logo -->
        <div class="auth-logo">
            <div class="auth-logo-icon">
                <i class="fas fa-bolt"></i>
            </div>
            <h2 class="auth-title">欢迎回来</h2>
            <p class="auth-subtitle">登录您的NewsFlow账户</p>
        </div>

        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label for="id_username" class="form-label">用户名</label>
                <div class="input-icon-wrapper">
                    <i class="fas fa-user"></i>
                    <input type="text" class="form-control form-control-icon" id="id_username" name="username" placeholder="请输入用户名" required>
                </div>
            </div>

            <div class="mb-4">
                <label for="id_password" class="form-label">密码</label>
                <div class="input-icon-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" class="form-control form-control-icon" id="id_password" name="password" placeholder="请输入密码" required>
                    <button type="button" class="password-toggle" onclick="togglePassword(this)">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 btn-lg">
                <i class="fas fa-sign-in-alt"></i> 登录
            </button>
        </form>

        <div class="auth-divider">
            <span>或</span>
        </div>

        <p class="text-center" style="color: var(--text-muted); font-size: 0.9rem;">
            还没有账号？
            <a href="{% url 'blog:register' %}" style="color: var(--primary); font-weight: 600; text-decoration: none;">
                立即注册 <i class="fas fa-arrow-right" style="font-size: 0.8rem;"></i>
            </a>
        </p>
    </div>
</div>
{% endblock %}

{% block extra_css %}
<style>
    .auth-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 60vh;
        padding: 2rem 0;
    }

    .auth-card {
        width: 100%;
        max-width: 420px;
        background: var(--bg-card);
        border-radius: var(--radius-xl);
        padding: 2.5rem;
        border: 1px solid var(--border-color);
        box-shadow: var(--shadow-lg);
    }

    .auth-logo {
        text-align: center;
        margin-bottom: 2rem;
    }

    .auth-logo-icon {
        width: 56px;
        height: 56px;
        border-radius: var(--radius-md);
        background: var(--gradient-primary);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 1.5rem;
        margin: 0 auto 1rem;
    }

    .auth-title {
        font-size: 1.5rem;
        font-weight: 800;
        color: var(--text-primary);
        margin-bottom: 0.25rem;
    }

    .auth-subtitle {
        color: var(--text-muted);
        font-size: 0.9rem;
    }

    .input-icon-wrapper {
        position: relative;
    }

    .input-icon-wrapper > i {
        position: absolute;
        left: 1rem;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted);
        font-size: 0.85rem;
        z-index: 1;
    }

    .form-control-icon {
        padding-left: 2.75rem !important;
    }

    .password-toggle {
        position: absolute;
        right: 1rem;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        padding: 0;
        font-size: 0.85rem;
        transition: var(--transition);
    }

    .password-toggle:hover {
        color: var(--primary);
    }

    .btn-lg {
        padding: 0.75rem 1.5rem;
        font-size: 1rem;
    }

    .auth-divider {
        text-align: center;
        margin: 1.5rem 0;
        position: relative;
    }

    .auth-divider::before {
        content: '';
        position: absolute;
        top: 50%;
        left: 0;
        right: 0;
        height: 1px;
        background: var(--border-color);
    }

    .auth-divider span {
        background: var(--bg-card);
        padding: 0 1rem;
        position: relative;
        color: var(--text-muted);
        font-size: 0.85rem;
    }
</style>
{% endblock %}

{% block extra_js %}
<script>
function togglePassword(btn) {
    const input = btn.parentElement.querySelector('input');
    const icon = btn.querySelector('i');
    if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fas fa-eye-slash';
    } else {
        input.type = 'password';
        icon.className = 'fas fa-eye';
    }
}
</script>
{% endblock %}
