{% extends 'base.html' %}

{% block title %}登录 - 咨询博客{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="article-detail">
            <h2 class="mb-4 text-center"><i class="fas fa-sign-in-alt"></i> 用户登录</h2>

            <form method="post">
                {% csrf_token %}

                <div class="mb-3">
                    <label for="id_username" class="form-label">用户名</label>
                    <input type="text" class="form-control" id="id_username" name="username" required>
                </div>

                <div class="mb-3">
                    <label for="id_password" class="form-label">密码</label>
                    <input type="password" class="form-control" id="id_password" name="password" required>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    <i class="fas fa-sign-in-alt"></i> 登录
                </button>
            </form>

            <hr class="my-4">

            <p class="text-center text-muted">
                还没有账号？ <a href="{% url 'blog:register' %}">立即注册</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
